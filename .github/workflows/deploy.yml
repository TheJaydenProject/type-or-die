name: Deploy to Production

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: deploy-type-or-die
  cancel-in-progress: false

# Every action is pinned to a full commit SHA (the tag it came from is in the trailing
# comment). Tags and branches can be moved by whoever controls the action's repo, and the
# deploy job hands the server's SSH key to some of them. Same pins as the jwarchive deploy.
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint & Format Check (Biome)
        run: npx @biomejs/biome check ./server ./client ./shared

      - name: Build Shared
        run: npm run build --workspace=@typeordie/shared

      - name: Build & Type-check Server
        run: npm run build --workspace=@typeordie/server

      - name: Build Client
        run: npm run build --workspace=client

  deploy:
    needs: build-and-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # lets the Tailscale step log in with GitHub's OIDC token
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Joins the tailnet as a short-lived tag:ci device, so the steps below reach the server over
      # Tailscale (SSH_HOST is its tailnet address). The tailnet policy lets tag:ci reach only SSH.
      - name: Connect to Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ secrets.SSH_HOST }}

      - name: Prepare Staging Directory
        uses: appleboy/ssh-action@c4f70287fc37c43b14b30b407224bbbc8e8c6327 # master as of 2026-08-16
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            rm -rf ~/deploy_staging_tod
            mkdir -p ~/deploy_staging_tod

      - name: Copy Source to Staging
        uses: appleboy/scp-action@7e85c2e09aa21988492acd66466b5d68bda49e2b # master as of 2026-08-09
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "client,server,shared,package.json,package-lock.json"
          target: "/home/ubuntu/deploy_staging_tod"
          strip_components: 0

      - name: Sync, Build & Restart
        uses: appleboy/ssh-action@c4f70287fc37c43b14b30b407224bbbc8e8c6327 # master as of 2026-08-16
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            echo "Syncing source code (preserving .env, docker-compose.yml, init-sentences-db.sql, volumes)..."
            rsync -a --delete --exclude='.env' --exclude='node_modules' --exclude='dist' ~/deploy_staging_tod/client/ ~/type-or-die/client/
            rsync -a --delete --exclude='.env' --exclude='node_modules' --exclude='dist' ~/deploy_staging_tod/server/ ~/type-or-die/server/
            rsync -a --delete --exclude='.env' --exclude='node_modules' --exclude='dist' ~/deploy_staging_tod/shared/ ~/type-or-die/shared/
            cp ~/deploy_staging_tod/package.json ~/deploy_staging_tod/package-lock.json ~/type-or-die/

            echo "Building images..."
            cd ~/type-or-die
            docker compose build backend frontend

            echo "Restarting containers (no volume wipe)..."
            docker compose up -d --remove-orphans

            echo "Verifying container health..."
            sleep 5
            RUNNING=$(docker compose ps --status running -q | wc -l)
            if [ "$RUNNING" -ge 4 ]; then
              echo "Deployment successful! ($RUNNING/4 containers running)"
              docker ps | grep type-or-die
              rm -rf ~/deploy_staging_tod
            else
              echo "Deployment failed! Only $RUNNING/4 expected containers running."
              docker compose ps
              exit 1
            fi

            echo "DEPLOYMENT COMPLETE"
